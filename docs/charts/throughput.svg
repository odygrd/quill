<title id="throughput_title">Throughput Comparison</title>
<desc id="throughput_desc">Ranked backend throughput for 8 text-output logging modes in millions of messages per second. Higher values are better; equal rates share a rank and binary-output modes are omitted. Quill results use v13.0.0.</desc>
